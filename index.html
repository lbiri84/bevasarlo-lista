<style>
  /* A laszlobiri design system alapján (tokens.css). Régi változónevek az új tokenekre képezve. */
  :root {
    --text: var(--fg);
    --muted: var(--fg-muted);
    --card: var(--bg-raised);
    --accent-soft: color-mix(in srgb, var(--accent) 18%, transparent);
    --danger: #e2766c;
    --shadow: 0 0 0 1px var(--line);
    --radius: var(--radius-md);
    color-scheme: dark;
  }
  :root[data-theme="light"] { --danger: #b3392f; color-scheme: light; }
  :root[data-theme="slate"] { color-scheme: dark; }
  .mk .f{fill:var(--mark-filler)}.mk .l{fill:var(--mark-l)}.mk .b{fill:var(--mark-b)}.mk .lr{stroke:var(--mark-l)}.mk .br{stroke:var(--mark-ring)}
  .mk { width: 40px; height: auto; flex: none; }
  .menu-auth { margin: 0 0 12px; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--font-sans); }
  body { min-height: 100dvh; padding-bottom: calc(110px + env(safe-area-inset-bottom)); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }

  header { padding: calc(20px + env(safe-area-inset-top)) 0 8px; }
  header .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { font-size: 28px; line-height: 1.1; margin: 0; font-weight: 600; letter-spacing: -.03em; display: flex; align-items: center; gap: 12px; }
  h1 .biri { color: var(--accent-text); }
  .sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .sub.sync:empty { display: none; }
  .icon-btn { border: 0; background: var(--card); color: var(--text); width: 44px; height: 44px;
    border-radius: 50%; box-shadow: var(--shadow); font-size: 20px; cursor: pointer; }
  .icon-btn:active { transform: scale(.95); }

  .progress { height: 6px; background: var(--line); border-radius: 99px; margin: 14px 0 6px; overflow: hidden; }
  .progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }

  .group { margin-top: 18px; }
  .group h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
    margin: 0 4px 8px; display: flex; align-items: center; gap: 6px; font-weight: 600; }
  .group ul { list-style: none; margin: 0; padding: 0; background: var(--card);
    border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .item { display: flex; align-items: center; gap: 12px; padding: 4px 6px 4px 14px; min-height: 56px;
    border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .check { appearance: none; -webkit-appearance: none; flex: none; width: 26px; height: 26px; margin: 0;
    border: 2px solid var(--muted); border-radius: 50%; display: grid; place-content: center; cursor: pointer; transition: .15s; }
  .check::after { content: ""; width: 12px; height: 7px; border-left: 3px solid var(--brand-black); border-bottom: 3px solid var(--brand-black);
    transform: rotate(-45deg) scale(0); margin-top: -3px; transition: .15s; }
  .check:checked { background: var(--accent); border-color: var(--accent); }
  .check:checked::after { transform: rotate(-45deg) scale(1); }
  .label { flex: 1; min-width: 0; padding: 12px 0; font-size: 17px; cursor: pointer; overflow-wrap: anywhere; }
  .label small { color: var(--muted); font-size: 14px; margin-left: 6px; }
  .item.done .label { text-decoration: line-through; color: var(--muted); }
  .del { border: 0; background: transparent; color: var(--muted); width: 44px; height: 44px; font-size: 20px; cursor: pointer; border-radius: 50%; }
  .del:active { color: var(--danger); }

  .empty { text-align: center; color: var(--muted); padding: 64px 20px; }
  .empty .big { font-size: 56px; }

  .clear { display: block; margin: 22px auto 0; border: 0; background: transparent; color: var(--danger);
    font-size: 15px; padding: 10px 16px; cursor: pointer; }

  .addbar { position: fixed; left: 0; right: 0; bottom: 0; background: linear-gradient(transparent, var(--bg) 35%);
    padding: 24px 0 calc(14px + env(safe-area-inset-bottom)); }
  .addbar form { display: flex; gap: 8px; max-width: 640px; margin: 0 auto; padding: 0 16px; }
  /* type="search": a mobilböngészők nem ajánlanak névjegy-kitöltést; a keresőmező megjelenését kikapcsoljuk. */
  input[type="search"] { -webkit-appearance: none; appearance: none; }
  input[type="search"]::-webkit-search-decoration,
  input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
  /* Szerkeszthető div (nem input/textarea): az iOS Safari az űrlapmezőkhöz névjegy-kitöltést ajánlana, ide nem. */
  .field { font-family: inherit; display: block; overflow: hidden; white-space: nowrap; -webkit-user-select: text; user-select: text; }
  .field:empty::before { content: attr(data-placeholder); color: var(--muted, #8a97a3); pointer-events: none; }
  .addbar .field { flex: 1; min-width: 0; height: 52px; border-radius: 26px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font-size: 17px; line-height: 24px; padding: 13px 20px; box-shadow: var(--shadow); outline: none; }
  .addbar .field:focus { border-color: var(--accent); }
  .addbar form button { flex: none; width: 52px; height: 52px; border-radius: 50%; border: 0; background: var(--accent);
    color: var(--brand-black); font-size: 28px; line-height: 1; cursor: pointer; box-shadow: var(--shadow); }
  .addbar form button:active { transform: scale(.95); }
  .chips { display: flex; gap: 8px; overflow-x: auto; max-width: 640px; margin: 0 auto 10px; padding: 0 16px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 99px; padding: 8px 14px; font-size: 14px; cursor: pointer; }
  .chip:active { background: var(--accent-soft); }

  .toast { position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px);
    background: var(--brand-black); color: var(--brand-mist); padding: 10px 16px; border-radius: 99px; font-size: 14px;
    opacity: 0; pointer-events: none; transition: .25s; display: flex; gap: 12px; align-items: center; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast button { background: none; border: 0; color: var(--brand-orange); font-weight: 700; font-size: 14px; cursor: pointer; }

  dialog { border: 0; border-radius: var(--radius-lg); padding: 20px; background: var(--card); color: var(--text);
    width: min(92vw, 380px); box-shadow: 0 0 0 1px var(--line); }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  .pick-cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 0 0 12px; }
  .pick-cat { min-height: 104px; border-radius: 20px; border: 1px solid var(--line); background: var(--bg); color: var(--text);
    font-family: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 8px 6px; }
  .pick-cat .ic { font-size: 40px; line-height: 1; }
  .pick-cat .nm { font-size: 13px; line-height: 16px; font-weight: 500; text-align: center; }
  .pick-cat:active { border-color: var(--accent); background: var(--accent-soft); }
  .pick-head { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; }
  .pick-back { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg);
    color: var(--text); font-size: 22px; cursor: pointer; }
  .pick-title { font-size: 17px; font-weight: 600; margin: 0; }
  #pickDlg [hidden] { display: none !important; }
  .pick-list { display: flex; flex-wrap: wrap; gap: 8px; max-height: 42vh; overflow-y: auto; padding: 2px; }
  .pick-item { border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 99px;
    padding: 9px 14px; font-size: 15px; cursor: pointer; font-family: inherit; }
  .pick-item.on { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  .pick-item.on::before { content: "✓ "; }
  dialog h3 { margin: 0 0 12px; }
  dialog .field { width: 100%; height: 46px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-size: 16px; line-height: 22px; padding: 11px 14px; margin-bottom: 10px; }
  dialog .btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; flex-wrap: wrap; }
  dialog .btn { border: 0; border-radius: 12px; padding: 12px 16px; font-size: 15px; cursor: pointer;
    background: var(--bg); color: var(--text); }
  dialog .btn.primary { background: var(--accent); color: var(--brand-black); font-weight: 600; }
  dialog .menu button { display: block; width: 100%; text-align: left; border: 0; background: transparent; color: var(--text);
    padding: 14px 6px; font-size: 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  dialog .menu button:last-child { border-bottom: 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="row">
      <div>
        <h1><svg class="mk" viewBox="0 0 81 53" role="img" aria-label="laszlobiri jel"><g transform="rotate(180 40.5 26.5)"><g transform="translate(81 0) rotate(90)"><circle class="f" cx="47.5" cy="5.5" r="4"/><circle class="f" cx="33.5" cy="19.5" r="4"/><circle class="f" cx="47.5" cy="33.5" r="4"/><circle class="f" cx="33.5" cy="47.5" r="4"/><circle class="l" cx="5.5" cy="5.5" r="4"/><circle class="l" cx="5.5" cy="19.5" r="4"/><circle class="l" cx="5.5" cy="33.5" r="4"/><circle class="l" cx="5.5" cy="47.5" r="4"/><circle class="l" cx="5.5" cy="61.5" r="4"/><circle class="l" cx="5.5" cy="75.5" r="4"/><circle class="l" cx="19.5" cy="75.5" r="4"/><circle class="l" cx="33.5" cy="75.5" r="4"/><circle class="l" cx="47.5" cy="75.5" r="4"/><circle class="b" cx="19.5" cy="5.5" r="4"/><circle class="b" cx="19.5" cy="19.5" r="4"/><circle class="b" cx="19.5" cy="33.5" r="4"/><circle class="b" cx="19.5" cy="47.5" r="4"/><circle class="b" cx="19.5" cy="61.5" r="4"/><circle class="b" cx="33.5" cy="5.5" r="4"/><circle class="b" cx="33.5" cy="33.5" r="4"/><circle class="b" cx="47.5" cy="19.5" r="4"/><circle class="lr" cx="47.5" cy="61.5" r="3" fill="none" stroke-width="2"/><circle class="br" cx="33.5" cy="61.5" r="3" fill="none" stroke-width="2"/><circle class="br" cx="47.5" cy="47.5" r="3" fill="none" stroke-width="2"/></g></g></svg><span>Bevásárlólista</span></h1>

<script type="module">
// A lista a háztartás közös listája (Supabase). Minden módosítás azonnal megjelenik,
// és a kimenő sorba (outbox) kerül; hálózat esetén sorrendben elmegy, offline megvárja.
// Terv: laszlobiri-com/docs/backend-terv.md, 2. fázis.
import { ready } from 'https://laszlobiri.com/lib/v1/gate.js';
import { supabase } from 'https://laszlobiri.com/lib/v1/client.js';
import { createOutbox } from 'https://laszlobiri.com/lib/v1/outbox.js';

(() => {
  'use strict';

  const CATS = [
    { id: 'zold',   name: 'Zöldség, gyümölcs', icon: '🥦' },
    { id: 'tej',    name: 'Tejtermék, tojás',  icon: '🥛' },
    { id: 'hus',    name: 'Hús, felvágott',    icon: '🥩' },
    { id: 'pek',    name: 'Pékáru',            icon: '🥖' },
    { id: 'szaraz', name: 'Száraz áru, konzerv', icon: '🍝' },
    { id: 'ital',   name: 'Italok',            icon: '🥤' },
    { id: 'fagy',   name: 'Fagyasztott',       icon: '🧊' },
    { id: 'haztartas', name: 'Háztartás, drogéria', icon: '🧴' },
    { id: 'egyeb',  name: 'Egyéb',             icon: '📦' },
  ];

  // Kulcsszavas kategória-tipp (ékezet nélkül, kisbetűvel keresünk)
  const KEYWORDS = {
    zold: ['alma','korte','banan','narancs','citrom','paradicsom','paprika','uborka','hagyma','fokhagyma','krumpli','burgonya','sargarepa','repa','saláta','salata','brokkoli','karfiol','cukkini','padlizsan','gomba','szolo','eper','malna','szilva','barack','dinnye','avokado','spenot','kelkaposzta','kaposzta','zeller','petrezselyem','zoldseg','gyumolcs','cseresznye','kiwi','mandarin','gyömbér','gyomber'],
    tej: ['tej','tejfol','joghurt','sajt','vaj','turo','tojas','kefir','tejszin','mascarpone','mozzarella','parmezan','margarin','trappista','krem'],
    hus: ['csirke','hus','sertes','marha','kolbasz','szalami','sonka','virsli','bacon','szalonna','kacsa','pulyka','hal','lazac','tonhal','daralt','fasirt','parizer'],
    pek: ['kenyer','zsemle','kifli','pogacsa','pek','bagett','toast','kalacs','lepeny','tortilla','molnar'],
    szaraz: ['teszta','rizs','liszt','cukor','so','olaj','ecet','konzerv','kukorica','bab','lencse','borso','musli','pehely','zab','kave','tea','fuszer','bors','paprikas','lekvar','mez','csoki','keksz','chips','dio','mandula','mogyoro','szosz','ketchup','mustar','majonez','puding','kakao','tomatpure','paradicsomlev'],
    ital: ['viz','asvanyviz','uditő','udito','cola','sor','bor','palinka','narancslé','gyumolcsle','limonade','energia','szoda','szörp','szorp'],
    fagy: ['fagyasztott','fagyi','jegkrem','mirelit','pizza','hasab'],
    haztartas: ['wc','papir','zsebkendo','szappan','samponn','sampon','tusfurdo','fogkrem','fogkefe','mosopor','mosogato','tisztito','szemeteszsak','zsak','folia','szalveta','pelenka','dezodor','borotva','vattapamacs','kozmetikai','szivacs','locsolo','izzo','elem','gyertya','tablet','kondicionalo','oblito'],
  };
  const fold = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  function guessCat(name) {
    const n = fold(name);
    for (const [cat, words] of Object.entries(KEYWORDS)) {
      if (words.some(w => n.includes(fold(w)))) return cat;
    }
    return 'egyeb';
  }

  // ---- állapot ----
  // Döntés: a régi, belépés nélküli helyi lista törlődik, nem kerül fel.
  try { localStorage.removeItem('bevasarlo-lista.v1'); } catch (e) {}

  // Helyi gyorsítótár a közös listáról (offline megnyitáshoz) és a kimenő sor.
  const KEY = 'bevasarlo-lista.v2';
  const outbox = createOutbox('bevasarlo-lista.outbox.v1');
  const CAT_IDS = new Set(CATS.map(c => c.id));
  const UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  let state = load();
  let noList = false;
  function empty() { return { items: [], history: [], listId: null, householdId: null, userId: null }; }
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY));
      if (s && Array.isArray(s.items) && Array.isArray(s.history)) return Object.assign(empty(), s);
    } catch (e) {}
    return empty();
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }
  const uid = () => crypto.randomUUID();
  const key = name => fold(name).slice(0, 80);
  const iso = ms => new Date(ms).toISOString();

  // ---- műveletek a kimenő sorba ----
  function opCreate(it) {
    outbox.enqueue({ t: 'create', id: it.id, row: {
      id: it.id, name: it.name, name_key: key(it.name), qty: it.qty || '', cat: it.cat, done: !!it.done, added_at: iso(it.added),
    } });
    kick();
  }
  function opPatch(id, fields) {
    if ('name' in fields) fields.name_key = key(fields.name);
    outbox.enqueue({ t: 'patch', id, fields });
    kick();
  }
  const opDelete = it => opPatch(it.id, { deleted_at: new Date().toISOString() });
  const opRestore = it => opPatch(it.id, { deleted_at: null, name_key: key(it.name) });
  function opBump(name, cat) { outbox.enqueue({ t: 'bump', name, cat }); kick(); }

  // A szerver sora → helyi tétel. Ismeretlen kategória vagy hibás azonosító nem kerül a DOM-ba.
  function fromRow(r) {
    if (!UUID.test(r.id)) return null;
    return { id: r.id, name: String(r.name), qty: String(r.qty || ''), cat: CAT_IDS.has(r.cat) ? r.cat : 'egyeb', done: !!r.done, added: Date.parse(r.added_at) || Date.now() };
  }

  // A még el nem küldött műveletek alkalmazása a szerverről jött állapotra.
  function replayPending() {
    for (const op of outbox.pending()) {
      if (op.t === 'create') {
        if (state.items.some(i => i.id === op.id || fold(i.name) === op.row.name_key)) continue;
        const it = fromRow(op.row); if (it) state.items.push(it);
      } else if (op.t === 'patch') {
        const it = state.items.find(i => i.id === op.id);
        const f = op.fields;
        if (f.deleted_at) { state.items = state.items.filter(i => i.id !== op.id); continue; }
        if (!it) continue;
        if ('done' in f) it.done = f.done;
        if ('name' in f) it.name = f.name;
        if ('qty' in f) it.qty = f.qty;
        if ('cat' in f && CAT_IDS.has(f.cat)) it.cat = f.cat;
      } else if (op.t === 'bump') {
        bumpLocal(op.name, op.cat);
      }
    }
  }

  // ---- szinkron ----
  async function handle(op) {
    if (op.t === 'create') {
      const { error } = await supabase.from('items').insert({ ...op.row, list_id: state.listId });
      if (!error) return;
      if (error.code === '23505' && /items_pkey/.test(error.message)) return;   // már fent van (ismételt küldés)
      if (error.code === '23505') {
        // Ugyanilyen nevű tétel már van a listán (pl. a másik telefon offline felvette):
        // a meglévőhöz csatlakozunk, mint a „már rajta volt” esetben.
        const { data, error: e2 } = await supabase.from('items').select('id')
          .eq('list_id', state.listId).eq('name_key', op.row.name_key).maybeSingle();
        if (e2) throw e2;
        if (!data) throw error;
        const fields = { done: false };
        if (op.row.qty) fields.qty = op.row.qty;
        const { error: e3 } = await supabase.from('items').update(fields).eq('id', data.id);
        if (e3) throw e3;
        outbox.rewrite(o => (o.id === op.id ? { ...o, id: data.id } : o));
        return;
      }
      throw error;
    }
    if (op.t === 'patch') {
      const { error } = await supabase.from('items').update(op.fields).eq('id', op.id);
      // 23505: a visszavonás vagy átnevezés ütközik egy azóta felvett azonos nevű tétellel → elmarad.
      if (error && error.code !== '23505') throw error;
      return;
    }
    if (op.t === 'bump') {
      const { error } = await supabase.rpc('bump_history', {
        p_household: state.householdId, p_name_key: key(op.name), p_name: op.name, p_cat: op.cat,
      });
      if (error) throw error;
    }
  }

  async function ensureList() {
    if (state.listId) return true;
    const { data, error } = await supabase.from('lists').select('id, household_id').limit(1).maybeSingle();
    if (error) throw error;
    if (!data) { noList = true; render(); return false; }
    state.listId = data.id; state.householdId = data.household_id; save();
    return true;
  }

  async function pull() {
    const [items, hist] = await Promise.all([
      supabase.from('items').select('id, name, qty, cat, done, added_at')
        .eq('list_id', state.listId).is('deleted_at', null).order('added_at'),
      supabase.from('item_history').select('name, cat, count, last_used')
        .eq('household_id', state.householdId)
        .order('count', { ascending: false }).order('last_used', { ascending: false }).limit(200),
    ]);
    if (items.error) throw items.error;
    if (hist.error) throw hist.error;
    state.items = items.data.map(fromRow).filter(Boolean);
    state.history = hist.data.filter(h => CAT_IDS.has(h.cat))
      .map(h => ({ name: String(h.name), cat: h.cat, count: h.count, last: Date.parse(h.last_used) || 0 }));
    replayPending();
    save(); render();
  }

  let syncing = false, again = false, kickTimer = null, channel = null;
  const kick = () => { clearTimeout(kickTimer); kickTimer = setTimeout(sync, 300); };
  async function sync() {
    if (!supabase) return;
    if (syncing) { again = true; return; }
    syncing = true;
    try {
      if (!(await ensureList())) return;
      const r = await outbox.flush(handle, (op, error) => {
        console.warn('A művelet nem menthető, kimarad:', op, error);
        toast('Egy változást nem sikerült menteni');
      });
      if (r !== 'offline') await pull();
      subscribe();
    } catch (e) {
      /* hálózati hiba: a következő alkalommal újra */
    } finally {
      syncing = false;
      renderStatus();
      if (again) { again = false; kick(); }
    }
  }

  // Valós idejű frissítés: a másik telefon módosítása után újratöltjük a listát.
  // Hiba vagy bontás után a következő szinkron újra feliratkozik.
  function subscribe() {
    if (channel || !state.listId) return;
    let t, closed = false;
    const ch = supabase.channel('items:' + state.listId)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'items', filter: 'list_id=eq.' + state.listId },
        () => { clearTimeout(t); t = setTimeout(kick, 200); });
    channel = ch;
    ch.subscribe(status => {
      if (closed || !['CHANNEL_ERROR', 'TIMED_OUT', 'CLOSED'].includes(status)) return;
      closed = true;                       // a removeChannel újra CLOSED-ot jelez: csak egyszer
      if (channel === ch) channel = null;
      supabase.removeChannel(ch);
    });
  }

  function renderStatus() {
    const el = document.getElementById('syncState');
    if (!el) return;
    const n = outbox.size();
    el.textContent = noList ? 'Ehhez a fiókhoz nem tartozik közös lista.'
      : n ? (navigator.onLine === false ? `Offline · ${n} változás vár` : `Mentés… (${n})`) : '';
  }

  async function start() {
    const { user } = await ready;
    // Másik felhasználó lépett be ezen a telefonon: a helyi másolat és a sor az előzőé.
    if (user && state.userId && state.userId !== user.id) { state = empty(); outbox.clear(); }
    if (user) { state.userId = user.id; save(); }
    render();
    sync();
  }
  window.addEventListener('online', kick);
  window.addEventListener('offline', renderStatus);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') kick(); });

  // ---- elemek ----
  const $ = id => document.getElementById(id);
  const listEl = $('list'), form = $('form'), input = $('input'), chipsEl = $('chips');
  // a szerkeszthető div-ek úgy viselkednek, mint egy mező: .value
  [input, $('editName')].forEach(el => {
    Object.defineProperty(el, 'value', { get() { return el.textContent; }, set(v) { el.textContent = v; } });
    el.addEventListener('paste', e => { e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData.getData('text/plain') || '').replace(/\s*\n+\s*/g, ' ')); });
  });

  // ---- render ----
  function render() {
    const total = state.items.length;
    const done = state.items.filter(i => i.done).length;
    $('sub').textContent = total ? `${done} / ${total} kipipálva` : 'Még üres a lista';
    renderStatus();
    $('bar').style.width = total ? (done / total * 100) + '%' : '0';

    if (!total) {
      listEl.innerHTML = `<div class="empty"><div class="big">🧺</div><p>Nincs még semmi a listán.<br>Írj be valamit alul, vagy koppints egy javaslatra.</p></div>`;
    } else {
      let html = '';
      const row = i => `<li class="item${i.done ? ' done' : ''}" data-id="${i.id}">
            <input type="checkbox" class="check" ${i.done ? 'checked' : ''} aria-label="Kipipál">
            <div class="label" data-act="edit">${esc(i.name)}${i.qty ? `<small>${esc(i.qty)}</small>` : ''}</div>
            <button class="del" data-act="del" aria-label="Törlés">✕</button>
          </li>`;
      // Nyitott tételek kategóriánként, a kipipáltak egy külön szakaszban legalul, hogy fogyjon a lista.
      for (const c of CATS) {
        const items = state.items.filter(i => i.cat === c.id && !i.done).sort((a, b) => a.added - b.added);
        if (!items.length) continue;
        html += `<section class="group"><h2>${c.icon} ${c.name}</h2><ul>${items.map(row).join('')}</ul></section>`;
      }
      if (done) {
        const items = state.items.filter(i => i.done).sort((a, b) => a.added - b.added);
        html += `<section class="group done-group"><h2>🧺 Kosárban</h2><ul>${items.map(row).join('')}</ul></section>`;
        html += `<button class="clear" id="clearDone">Kipipáltak törlése (${done})</button>`;
      }
      listEl.innerHTML = html;
    }
    renderChips();
  }
  const esc = s => s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

  function renderChips() {
    const onList = new Set(state.items.filter(i => !i.done).map(i => fold(i.name)));
    const freq = {};
    state.history.forEach(h => { freq[h.name] = h; });
    const sugg = Object.values(freq)
      .filter(h => !onList.has(fold(h.name)))
      .sort((a, b) => b.count - a.count || b.last - a.last)
      .slice(0, 12);
    chipsEl.innerHTML = sugg.map(h => `<button class="chip" type="button" data-name="${esc(h.name)}" data-cat="${h.cat}">+ ${esc(h.name)}</button>`).join('');
    chipsEl.style.display = sugg.length ? '' : 'none';
  }

  // ---- hozzáadás ----
  // "2 l tej", "3 db alma", "tej 2 l" – a mennyiséget leválasztjuk
  function parse(text) {
    let t = text.trim().replace(/\s+/g, ' ');
    let qty = '';
    const units = '(?:kg|dkg|g|l|dl|ml|db|csomag|cs\\.?|doboz|üveg|zacskó|szál|fej|pár)';
    let m = t.match(new RegExp('^(\\d+(?:[.,]\\d+)?\\s*' + units + '?)\\s+(.+)$', 'i'));
    if (m) { qty = m[1]; t = m[2]; }
    else {
      m = t.match(new RegExp('^(.+?)\\s+(\\d+(?:[.,]\\d+)?\\s*' + units + '?)$', 'i'));
      if (m) { t = m[1]; qty = m[2]; }
    }
    t = t.charAt(0).toUpperCase() + t.slice(1);
    return { name: t, qty };
  }
  function addItem(raw, cat) {
    let { name, qty } = parse(raw);
    name = name.slice(0, 80); qty = qty.slice(0, 30);
    if (!name) return;
    const existing = state.items.find(i => fold(i.name) === fold(name));
    if (existing) {
      const fields = {};
      if (existing.done) { existing.done = false; fields.done = false; }
      if (qty && qty !== existing.qty) { existing.qty = qty; fields.qty = qty; }
      if (Object.keys(fields).length) opPatch(existing.id, fields);
      toast(`„${existing.name}" már rajta volt`);
    } else {
      const c = cat || guessCat(name);
      const it = { id: uid(), name, qty, cat: c, done: false, added: Date.now() };
      state.items.push(it);
      opCreate(it);
      bumpHistory(name, c);
    }
    save(); render();
  }
  function bumpHistory(name, cat) {
    bumpLocal(name, cat);
    opBump(name, cat);
  }
  function bumpLocal(name, cat) {
    const h = state.history.find(x => fold(x.name) === fold(name));
    if (h) { h.count++; h.last = Date.now(); h.cat = cat; }
    else state.history.push({ name, cat, count: 1, last: Date.now() });
    if (state.history.length > 200) {
      state.history.sort((a, b) => b.count - a.count || b.last - a.last);
      state.history.length = 200;
    }
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    const v = input.value.trim();
    if (!v) { openPicker(); return; }
    // vesszővel elválasztva több tétel is mehet egyszerre
    v.split(',').map(s => s.trim()).filter(Boolean).forEach(s => addItem(s));
    input.value = '';
    input.focus();
  });
  chipsEl.addEventListener('click', e => {
    const b = e.target.closest('.chip');
    if (b) addItem(b.dataset.name, b.dataset.cat);
  });

  // ---- lista műveletek ----
  let lastRemoved = null, toastTimer;
  function toast(msg, undo) {
    $('toastMsg').textContent = msg;
    $('undoBtn').style.display = undo ? '' : 'none';
    $('toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $('toast').classList.remove('show'), 4000);
  }
  $('undoBtn').addEventListener('click', () => {
    if (lastRemoved) {
      for (const it of lastRemoved) {
        // Ha közben ugyanilyen nevű tétel került a listára, a visszavonás elmarad.
        if (state.items.some(i => fold(i.name) === fold(it.name))) continue;
        state.items.push(it);
        opRestore(it);
      }
      lastRemoved = null; save(); render();
    }
    $('toast').classList.remove('show');
  });

  listEl.addEventListener('change', e => {
    if (!e.target.classList.contains('check')) return;
    const it = state.items.find(i => i.id === e.target.closest('.item').dataset.id);
    if (it) { it.done = e.target.checked; opPatch(it.id, { done: it.done }); save(); render(); if (navigator.vibrate) navigator.vibrate(10); }
  });
  listEl.addEventListener('click', e => {
    if (e.target.id === 'clearDone') {
      lastRemoved = state.items.filter(i => i.done);
      state.items = state.items.filter(i => !i.done);
      lastRemoved.forEach(opDelete);
      save(); render(); toast(`${lastRemoved.length} tétel törölve`, true);
      return;
    }
    const li = e.target.closest('.item');
    if (!li) return;
    const it = state.items.find(i => i.id === li.dataset.id);
    const act = e.target.dataset.act;
    if (act === 'del') {
      lastRemoved = [it];
      state.items = state.items.filter(i => i !== it);
      opDelete(it);
      save(); render(); toast(`„${it.name}" törölve`, true);
    } else if (act === 'edit') {
      openEdit(it);
    }
  });

  // ---- szerkesztés ----
  const editDlg = $('editDlg'); let editing = null;
  $('editCat').innerHTML = CATS.map(c => `<option value="${c.id}">${c.icon} ${c.name}</option>`).join('');
  function openEdit(it) {
    editing = it;
    $('editName').value = it.name + (it.qty ? ' ' + it.qty : '');
    $('editCat').value = it.cat;
    editDlg.showModal();
  }
  $('editCancel').addEventListener('click', () => editDlg.close());
  $('editForm').addEventListener('submit', () => {
    if (!editing) return;
    let { name, qty } = parse($('editName').value);
    name = name.slice(0, 80); qty = qty.slice(0, 30);
    if (name) {
      // Átnevezésnél a név nem ütközhet egy másik tétellel a listán.
      const clash = state.items.find(i => i !== editing && fold(i.name) === fold(name));
      if (clash) { toast(`„${clash.name}" már rajta van a listán`); return; }
      editing.name = name; editing.qty = qty; editing.cat = $('editCat').value;
      opPatch(editing.id, { name, qty, cat: editing.cat });
      bumpHistory(name, editing.cat);
    }
    save(); render();
  });

  // ---- menü ----
  const menuDlg = $('menuDlg');
  $('menuBtn').addEventListener('click', () => menuDlg.showModal());
  $('menuClose').addEventListener('click', () => menuDlg.close());
  $('uncheckBtn').addEventListener('click', () => {
    state.items.forEach(i => { if (i.done) { i.done = false; opPatch(i.id, { done: false }); } });
    save(); render(); menuDlg.close();
  });
  $('clearAllBtn').addEventListener('click', () => {
    if (!state.items.length) return menuDlg.close();
    lastRemoved = state.items; state.items = [];
    lastRemoved.forEach(opDelete);
    save(); render(); menuDlg.close(); toast('Lista törölve', true);
  });
  $('shareBtn').addEventListener('click', async () => {
    const lines = [];
    for (const c of CATS) {
      const items = state.items.filter(i => i.cat === c.id && !i.done);
      if (!items.length) continue;
      lines.push(`${c.icon} ${c.name}`);
      items.forEach(i => lines.push(`  • ${i.name}${i.qty ? ' – ' + i.qty : ''}`));
    }
    const text = 'Bevásárlólista\n\n' + (lines.join('\n') || '(üres)');
    menuDlg.close();
    try {
      if (navigator.share) { await navigator.share({ title: 'Bevásárlólista', text }); return; }
      await navigator.clipboard.writeText(text);
      toast('Vágólapra másolva');
    } catch (e) { /* megszakítva */ }
  });


  // ---- válogatás kategóriánként (a + gomb üres mezőnél) ----
  const CATALOG = {
    zold: ['Alma','Banán','Narancs','Citrom','Szőlő','Eper','Paradicsom','Paprika','Uborka','Hagyma','Fokhagyma','Krumpli','Sárgarépa','Saláta','Brokkoli','Cukkini','Gomba','Avokádo'],
    tej: ['Tej','Tojás','Vaj','Tejföl','Joghurt','Túró','Sajt','Tejszín','Mozzarella','Kefir','Margarin'],
    hus: ['Csirkemell','Csirkecomb','Darált hús','Sertéskaraj','Virsli','Felvágott','Sonka','Szalámi','Bacon','Pulykamell','Hal'],
    pek: ['Kenyér','Zsemle','Kifli','Bagett','Pogácsa','Toast kenyér','Tortilla'],
    szaraz: ['Tészta','Rizs','Liszt','Cukor','Só','Olaj','Konzerv kukorica','Bab','Lencse','Zabpehely','Kávé','Tea','Méz','Lekvár','Csokoládé','Keksz','Ketchup','Mustár'],
    ital: ['Ásványvíz','Szóda','Narancslé','Üdítő','Sör','Bor','Energiaital'],
    fagy: ['Fagyasztott zöldség','Fagyasztott pizza','Jégkrém','Fagyasztott hal'],
    haztartas: ['WC-papír','Papírtörlő','Zsebkendő','Mosogatószer','Mosópor','Szemeteszsák','Szappan','Tusfürdő','Sampon','Fogkrém','Alufólia'],
    egyeb: ['Elem','Izzó','Gyertya','Szalvéta'],
  };
  const pickDlg = $('pickDlg'); let pickCat = null;
  function pickItems(cat) {
    const names = [...(CATALOG[cat] || [])];
    state.history.filter(x => x.cat === cat).forEach(x => { if (!names.some(n => fold(n) === fold(x.name))) names.push(x.name); });
    state.items.filter(i => i.cat === cat).forEach(i => { if (!names.some(n => fold(n) === fold(i.name))) names.push(i.name); });
    return names.sort((a, b) => a.localeCompare(b, 'hu'));
  }
  // Két nézet: nagy kategória-ikonok, majd egy kategória tételei (vissza gombbal).
  function renderPick() {
    const inList = !!pickCat;
    $('pickCats').hidden = inList; $('pickHeading').hidden = inList;
    $('pickHead').hidden = !inList; $('pickList').hidden = !inList;
    if (!inList) {
      $('pickCats').innerHTML = CATS.map(c => `<button type="button" class="pick-cat" data-cat="${c.id}" aria-label="${c.name}"><span class="ic" aria-hidden="true">${c.icon}</span><span class="nm">${c.name}</span></button>`).join('');
      return;
    }
    const cat = CATS.find(c => c.id === pickCat);
    $('pickTitle').textContent = cat.icon + ' ' + cat.name;
    const onList = new Set(state.items.filter(i => !i.done).map(i => fold(i.name)));
    $('pickList').innerHTML = pickItems(pickCat).map(n => `<button type="button" class="pick-item${onList.has(fold(n)) ? ' on' : ''}" data-name="${esc(n)}">${esc(n)}</button>`).join('');
  }
  function openPicker() { input.blur(); pickCat = null; renderPick(); pickDlg.showModal(); }
  $('pickCats').addEventListener('click', e => {
    const b = e.target.closest('.pick-cat'); if (!b) return;
    pickCat = b.dataset.cat; renderPick();
  });
  $('pickBack').addEventListener('click', () => { pickCat = null; renderPick(); });
  $('pickList').addEventListener('click', e => {
    const b = e.target.closest('.pick-item'); if (!b) return;
    const name = b.dataset.name;
    const ex = state.items.find(i => fold(i.name) === fold(name) && !i.done);
    if (ex) { state.items = state.items.filter(i => i !== ex); opDelete(ex); save(); render(); }
    else addItem(name, pickCat);
    renderPick();
  });
  $('pickClose').addEventListener('click', () => pickDlg.close());


  // ---- PWA ----
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
  // más fülön/ablakban történt változás
  window.addEventListener('storage', e => {
    if (e.key === KEY) { state = load(); render(); }
    if (e.key === 'bevasarlo-lista.outbox.v1') renderStatus();
  });

  // Enter küldi el (az egysoros textarea nem szúr be új sort)
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); }
  });
  input.addEventListener('input', () => { if (input.value.includes('\n')) input.value = input.value.replace(/\n+/g, ' '); });
  $('editName').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); $('editForm').requestSubmit(); }
  });

  render();
  start();
})();
</script>
</body>
</html>
